name: FreshJuice CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  install_and_check:
    runs-on: ubuntu-latest
    concurrency:
      group: "fresh-juice-ci-${{ github.head_ref || github.run_id }}"
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache npm modules
        id: cache-node
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install npm dependencies
        run: npm install

      - name: Run checks
        run: |
          npm run spellcheck
          npm run format:check
          npm run lint:check
